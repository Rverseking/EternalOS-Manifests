- name: Configure Crave authentication (fixed)
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        run: |
          set -e

          # Correct format that prevents "Unfilled Header" / Login again errors
          cat > "$HOME/crave.conf" <<EOF
          {
            "username": "${CRAVE_USERNAME}",
            "headers": {
              "Content-Type": "application/json",
              "Authorization": "${CRAVE_TOKEN}",
              "User-Agent": "Crave"
            },
            "projects": [],
            "server": "https://foss.crave.io/api"
          }
          EOF

          chmod 600 "$HOME/crave.conf"
          echo "Crave authentication configured correctly."

      - name: Start Crave Devspace (no local AOSP download)
        run: |
          set -e

          # Put crave in PATH
          export PATH="$GITHUB_WORKSPACE:$PATH"

          echo "Crave version:"
          ./crave version

          echo "Listing available projects (to confirm auth works)..."
          ./crave list || true

          echo "Starting Crave Devspace with IDE..."
          # This hands everything to Crave's remote side.
          # No full AOSP sync happens on the GitHub runner.
          ./crave devspace --ide
