name: EternalOS Cloud Development Space

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Crave Project ID for the Android Source/AOSP project"
        required: false
        type: string

      aosp_branch:
        description: "AOSP branch/tag"
        required: true
        default: "android-15.0.0_r1"
        type: string

jobs:
  devspace:
    runs-on: ubuntu-latest

    steps:
      - name: Install Crave
        run: |
          set -e

          echo "Installing Crave..."

          curl -sL \
            https://raw.githubusercontent.com/accupara/crave/refs/heads/master/get_crave.sh \
            | bash -s --

          chmod +x ./crave

          echo "Crave version:"
          ./crave version

      - name: Configure Crave
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        run: |
          set -e

          if [ -z "$CRAVE_USERNAME" ]; then
            echo "ERROR: CRAVE_USERNAME secret is empty."
            exit 1
          fi

          if [ -z "$CRAVE_TOKEN" ]; then
            echo "ERROR: CRAVE_TOKEN secret is empty."
            exit 1
          fi

          # Crave searches $HOME/crave.conf automatically.
          #
          # These are the username and Authorization values from
          # the real crave.conf supplied by the Crave dashboard.
          #
          # The token itself is NEVER printed to the Actions log.

          cat > "$HOME/crave.conf" <<EOF
          username: ${CRAVE_USERNAME}
          Authorization: ${CRAVE_TOKEN}
          EOF

          chmod 600 "$HOME/crave.conf"

          echo "Crave credentials configured."

      - name: Verify Crave account
        run: |
          set -e

          echo "Checking Crave account..."

          ./crave list

      - name: Create remote Crave DevSpace
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -e

          echo "Creating remote Crave workspace..."
          echo "Project ID: ${PROJECT_ID}"

          ./crave clone create \
            --projectID "$PROJECT_ID"

          echo
          echo "Remote Crave workspace created."

      - name: Open Crave DevSpace
        run: |
          set -e

          echo "Starting Crave DevSpace..."
          echo
          echo "AOSP source will live on Crave, NOT on the GitHub runner."
          echo

          ./crave devspace
