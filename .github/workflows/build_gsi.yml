name: EternalOS Cloud Development Space
on:
  workflow_dispatch:
jobs:
  devspace:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - env:
        CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
        CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
      run: |
        curl -sL https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh -o crave && chmod +x crave
        
        # Authenticate using the CLI parameters/environment variables directly
        ./crave login --username "$CRAVE_USERNAME" --token "$CRAVE_TOKEN" || true
        
        ./crave repo init -u https://github.com -b main -m default.xml && ./crave repo sync
        ./crave devspace --ide

