name: EternalOS Cloud Development Space

on:
  workflow_dispatch:

jobs:
  devspace:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Crave and Launch IDE
      env:
        CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
        CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
      run: |
        curl -s https://raw.githubusercontent.com/accupara/crave/refs/heads/master/get_crave.sh | bash -s --
        chmod +x crave
        echo '{"Authorization": "'"$CRAVE_TOKEN"'", "User-Agent": "Crave", "projects": [], "server": "https://crave.io"}' > crave.conf
        ./crave repo init -u https://github.com -b main -m default.xml && ./crave repo sync
        ./crave devspace --ide
