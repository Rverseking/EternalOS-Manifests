name: EternalOS Cloud Development Space
on:
  workflow_dispatch:
jobs:
  devspace:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - env:
        CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
        CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
      run: |
        curl -sL https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh -o crave && chmod +x crave
        
        # Python safely generates the JSON file without bash quote/escaping headaches
        python3 -c '
        import json, os
        config = {
            "Authorization": f"Bearer {os.environ[\"CRAVE_TOKEN\"]}",
            "User-Agent": "Crave",
            "projects": [],
            "server": "https://crave.io"
        }
        with open("crave.conf", "w") as f:
            json.dump(config, f, indent=2)
        '
        
        ./crave repo init -u https://github.com -b main -m default.xml && ./crave repo sync
        ./crave devspace --ide

