name: EternalOS Crave GSI Sync Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Crave CLI & Auth Secrets
        run: |
          curl -sL https://raw.githubusercontent.com/accupara/crave/refs/heads/master/get_crave.sh -o get_crave.sh
          bash get_crave.sh
          sudo chmod +x crave
          sudo mv crave /usr/local/bin/crave

          mkdir -p ~/.crave
          cat <<EOF > ~/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth_token": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

      - name: Create Workspace on Crave
        run: |
          # Allocate a dedicated workspace named eternal_aosp15
          crave clone create --projectID 1 eternal_aosp15 || true

      - name: Sync EternalOS AOSP 15 Source Code
        run: |
          # Clean workspace directory and repo init your manifest from scratch
          crave run -- "rm -rf .repo/local_manifests .repo/manifests && \
            repo init -u https://github.com/${{ github.repository }}.git -b main --depth=1 && \
            repo sync -c --force-sync --no-clone-bundle --no-tags -j\$(nproc)"
