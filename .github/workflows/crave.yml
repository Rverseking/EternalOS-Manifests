name: EternalOS Crave GSI Sync Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Crave CLI
        run: |
          mkdir -p ~/.crave
          cat <<'EOF' > ~/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth_token": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF
          curl -sL https://raw.githubusercontent.com/accupara/crave/main/get_crave.sh | bash
          chmod +x crave || true
          sudo mv crave /usr/bin/crave || sudo mv crave /usr/local/bin/crave

      - name: Sync Source Code on Crave (No Compiling!)
        run: |
          crave run -- "repo init -u https://github.com/${{ github.repository }}.git -b main && repo sync -c --force-sync --no-clone-bundle --no-tags -j\$(nproc --all)"
