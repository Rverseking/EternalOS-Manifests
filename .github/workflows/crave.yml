name: EternalOS Crave GSI Sync Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Crave CLI & Auth Secrets
        run: |
          curl -sL https://raw.githubusercontent.com/accupara/crave/refs/heads/master/get_crave.sh -o get_crave.sh
          bash get_crave.sh
          sudo chmod +x crave
          sudo mv crave /usr/local/bin/crave

          mkdir -p ~/.crave
          cat <<EOF > ~/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth_token": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

      - name: Sync Source Code on Crave
        run: |
          # Create a dummy crave.yaml to satisfy local CLI checks
          cat <<EOF > crave.yaml
          base: ubuntu:22.04
          EOF

          # Pull and execute your hosted raw build script on Crave
          crave run --projectURL https://github.com/LineageOS/android.git -- "curl -sL https://raw.githubusercontent.com/Rverseking/EternalOS-Manifests/main/build.sh | bash"
