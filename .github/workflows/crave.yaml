name: EternalOS Crave GSI Sync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Crave CLI & Auth Secrets
        run: |
          # 1. Install Crave CLI
          curl -sL https://raw.githubusercontent.com/accupara/crave/refs/heads/master/get_crave.sh -o get_crave.sh
          bash get_crave.sh
          sudo chmod +x crave
          sudo mv crave /usr/local/bin/crave

          # 2. Write authentication file
          mkdir -p ~/.crave
          cat <<EOF > ~/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth_token": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

      - name: Write Local Crave Project Config
        run: |
          # Create crave.yaml in the runner workspace mapping to Crave's AOSP base project template 🎯
          cat <<EOF > crave.yaml
          AOSP:
            ignoreClientHostname: true
          EOF

      - name: Sync EternalOS 1.5 Source
        run: |
          # Run pure repo init + sync directly inside Crave's build environment using your default.xml
          crave run --no-patch -- "rm -rf .repo/local_manifests .repo/manifests && repo init -u https://github.com/Rverseking/EternalOS-Manifests.git -b main && repo sync -c --force-sync --no-clone-bundle --no-tags -j\$(nproc)"
