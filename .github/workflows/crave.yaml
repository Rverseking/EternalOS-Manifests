name: EternalOS Crave GSI Sync Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Crave CLI & Auth Secrets
        run: |
          curl -sL https://raw.githubusercontent.com/accupara/crave/refs/heads/master/get_crave.sh -o get_crave.sh
          bash get_crave.sh
          sudo chmod +x crave
          sudo mv crave /usr/local/bin/crave

          mkdir -p ~/.crave
          cat <<EOF > ~/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth_token": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

      - name: Sync EternalOS 1.5 (AOSP 15.0)
        run: |
          # 1. Create crave.yaml on the GitHub runner so Crave CLI links to the los21 project base
          cat <<EOF > crave.yaml
          los21:
            ignoreClientHostname: true
          EOF

          # 2. Run resync inside Crave to pull YOUR custom EternalOS AOSP 15.0 manifest
          crave run -- "rm -rf .repo/local_manifests .repo/manifests && /opt/crave/resync.sh https://github.com/${{ github.repository }}.git main"
