name: EternalOS Crave GSI Sync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Crave CLI & Configs
        run: |
          # 1. Install Crave CLI
          curl -sL https://raw.githubusercontent.com/accupara/crave/refs/heads/master/get_crave.sh -o get_crave.sh
          bash get_crave.sh
          sudo chmod +x crave
          sudo mv crave /usr/local/bin/crave

          # 2. Write authentication file
          mkdir -p ~/.crave
          cat <<EOF > ~/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth_token": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

          # 3. Write crave.yaml directly into ~/.crave/ and local root so it cannot be missed! 🎯
          cat <<EOF > ~/.crave/crave.yaml
          los21:
            ignoreClientHostname: true
          EOF

          cp ~/.crave/crave.yaml ./crave.yaml

      - name: Sync EternalOS 1.5 Source
        run: |
          # Explicitly pass -c ~/.crave/crave.yaml to stop Zero-Conf URL fallback
          crave -c ~/.crave/crave.yaml run -- "rm -rf .repo/local_manifests .repo/manifests && /opt/crave/resync.sh https://github.com/${{ github.repository }}.git main"
