name: EternalOS Crave GSI Sync Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Crave CLI
        run: |
          curl -sL https://raw.githubusercontent.com/accupara/crave/refs/heads/master/get_crave.sh -o get_crave.sh
          bash get_crave.sh
          sudo chmod +x crave
          sudo mv crave /usr/local/bin/crave

          mkdir -p ~/.crave
          cat <<EOF > ~/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth_token": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

      - name: Generate AOSP Crave Config
        run: |
          # Sets Crave base target directly to generic AOSP 
          cat <<EOF > crave.yaml
          AOSP:
            ignoreClientHostname: true
          EOF

      - name: Sync EternalOS 1.5 (AOSP 15.0)
        run: |
          # Pass --no-patch so Crave doesn't attempt Lineage-specific patches
          crave run --no-patch -- "curl -sL https://raw.githubusercontent/${{ github.repository }}/main/build.sh | bash"
