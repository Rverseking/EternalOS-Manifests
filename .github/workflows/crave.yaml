name: EternalOS Crave GSI Sync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Crave CLI & Auth Secrets
        run: |
          # 1. Download and install Crave CLI
          curl -sL https://raw.githubusercontent.com/accupara/crave/refs/heads/master/get_crave.sh -o get_crave.sh
          bash get_crave.sh
          sudo chmod +x crave
          sudo mv crave /usr/local/bin/crave

          # 2. Configure Crave authentication
          mkdir -p ~/.crave
          cat <<EOF > ~/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth_token": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

      - name: Generate Local Crave Config
        run: |
          # Explicitly create crave.yaml in current workspace folder
          # Pointing to "los21" assigns the build to an active Crave DevSpace container
          cat <<EOF > crave.yaml
          los21:
            ignoreClientHostname: true
          EOF

      - name: Sync EternalOS 1.5 Source
        run: |
          # Run the resync script using the local crave.yaml configuration file
          crave -c crave.yaml run -- "rm -rf .repo/local_manifests .repo/manifests && /opt/crave/resync.sh https://github.com/${{ github.repository }}.git main"
