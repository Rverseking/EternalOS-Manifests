name: EternalOS Crave GSI Sync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Crave CLI & Configs
        run: |
          # 1. Install Crave CLI
          curl -sL https://raw.githubusercontent.com/accupara/crave/refs/heads/master/get_crave.sh -o get_crave.sh
          bash get_crave.sh
          sudo chmod +x crave
          sudo mv crave /usr/local/bin/crave

          # 2. Write authentication credentials
          mkdir -p ~/.crave
          cat <<EOF > ~/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth_token": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

          # 3. Write official Crave YAML using quoted base project mapping 🎯
          cat <<EOF > crave.yaml
          "LOS 21":
            ignoreClientHostname: true
          EOF

      - name: Sync EternalOS 1.5 Source
        run: |
          # Executes remote resync on Crave's LOS 21 base container targeting EternalOS-Manifests
          crave run -- "rm -rf .repo/local_manifests .repo/manifests && /opt/crave/resync.sh https://github.com/Rverseking/EternalOS-Manifests.git main"
